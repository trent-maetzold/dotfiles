name: Publish host diff previews

on:
  workflow_run:
    workflows: [NixOS host diffs]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]

concurrency:
  group: host-diff-pages
  queue: max

permissions: {}

jobs:
  publish:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.path == '.github/workflows/host-diffs.yml' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Identify current PR
        id: pr
        # actions/github-script v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const number = run?.pull_requests[0]?.number ??
              context.payload.pull_request?.number;
            if (!number) return;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: number,
            });
            if (pr.base.ref !== 'main') return;
            if (run && (pr.state !== 'open' || pr.head.sha !== run.head_sha)) {
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
      - name: Check out only the published site
        if: steps.pr.outputs.number != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: site
      - name: Download report data
        if: steps.pr.outputs.number != '' && github.event_name == 'workflow_run'
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: host-report
          path: ${{ runner.temp }}/host-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Render or remove preview
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]]
          page="site/pr-$PR"
          rm -rf -- "$page"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y aha
            mkdir "$page"
            shopt -s nullglob
            hosts=()
            {
              printf 'PR #%s at %s\n\n' "$PR" "$SHA"
              for file in "$RUNNER_TEMP/host-report/"*.ansi; do
                [[ -f "$file" && ! -L "$file" ]] || continue
                host=${file##*/}
                host=${host%.ansi}
                [[ "$host" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]] || continue
                hosts+=("$host")
                printf '\n=== %s ===\n\n' "$host"
                # Artifact data is never executed or copied into the site raw.
                cat -- "$file"
              done
              if ((${#hosts[@]} == 0)); then
                echo 'No host derivation changes.'
              fi
              printf '%s\n' "${hosts[@]}" > "$RUNNER_TEMP/changed-hosts"
            } | aha --black --title "Host diffs — PR #$PR" > "$page/index.html"
          fi
      - name: Save site state
        if: steps.pr.outputs.number != ''
        shell: bash
        run: |
          git -C site add -A
          if ! git -C site diff --cached --quiet; then
            bot_mail='41898282+github-actions[bot]@users.noreply.github.com'
            git -C site -c user.name='github-actions[bot]' \
              -c user.email="$bot_mail" \
              commit -m 'Update host diff previews'
            git -C site push origin HEAD:gh-pages
          fi
          # Pages needs an artifact even when the last preview is removed.
          if [[ ! -e site/index.html ]]; then
            echo '<!doctype html><title>Host diffs</title>' > site/index.html
          fi
      # actions/upload-pages-artifact v5.0.0
      - uses: >-
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: steps.pr.outputs.number != ''
        with:
          path: site
      # actions/deploy-pages v5.0.1 (Node 24)
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deploy
        if: steps.pr.outputs.number != ''
      - name: Update the PR comment
        if: steps.pr.outputs.number != ''
        # actions/github-script v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const issue_number = Number(process.env.PR);
            const issue = { ...context.repo, issue_number };
            const marker = '<!-- host-diff-preview -->';
            const api = github.rest.issues;
            const comments = await github.paginate(api.listComments, issue);
            const comment = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.startsWith(marker));
            const closed = context.eventName === 'pull_request_target';
            if (closed && !comment) return;
            let body = `${marker}\nHost diff preview removed after merge.`;
            if (!closed) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: issue_number,
              });
              const { SHA, RUNNER_TEMP, PAGE_URL } = process.env;
              if (pr.state !== 'open' || pr.head.sha !== SHA) return;
              const hosts = readFileSync(`${RUNNER_TEMP}/changed-hosts`, 'utf8')
                .trim().split('\n').filter(Boolean).map(host => `\`${host}\``);
              const url = `${PAGE_URL.replace(/\/$/, '')}/pr-${issue_number}/`;
              body = `${marker}\n[NixOS host diffs](${url}) for ` +
                `\`${SHA.slice(0, 7)}\`\n\n` +
                `Hosts with diffs: ${hosts.join(', ') || 'none'}.`;
            }
            if (comment) {
              await api.updateComment({
                ...context.repo, comment_id: comment.id, body,
              });
            } else {
              await api.createComment({ ...issue, body });
            }
